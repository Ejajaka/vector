<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#6366f1" />
<title>Vector - preview</title>
<style>
/* Web / Capacitor client chrome. Result styling comes from the shared ui.css.
   This file makes the surrounding app look like a polished product page. */
:root {
  --v-accent: #6366f1;
  --m-bg: #f6f7fb;
  --m-panel: #ffffff;
  --m-line: #e6e8ef;
  --m-ink: #0f172a;
  --m-soft: #64748b;
}

@media (prefers-color-scheme: dark) {
  :root {
    --m-bg: #0b1020;
    --m-panel: #131a2c;
    --m-line: #24304a;
    --m-ink: #e8edf7;
    --m-soft: #93a1bb;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--m-bg);
  color: var(--m-ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
}
body {
  background:
    radial-gradient(1100px 520px at 10% -10%, rgba(99,102,241,.18), transparent 60%),
    radial-gradient(900px 480px at 110% 0%, rgba(14,165,233,.16), transparent 55%),
    var(--m-bg);
  background-attachment: fixed;
}

.hidden { display: none !important; }

/* ---------------- header ---------------- */
.m-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--m-panel) 88%, transparent);
  backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1px solid var(--m-line);
  padding-top: calc(14px + env(safe-area-inset-top));
}

.m-logo {
  width: 38px; height: 38px; border-radius: 11px;
  display: grid; place-items: center;
  color: #fff; font-weight: 800; font-size: 17px;
  background: linear-gradient(135deg, #6366f1, #0ea5e9);
  box-shadow: 0 6px 18px rgba(99,102,241,.4);
}

.m-title { flex: 1; min-width: 0; }
.m-title h1 { font-size: 17px; margin: 0; line-height: 1.1; letter-spacing: -.2px; }
.m-title p { margin: 2px 0 0; font-size: 11.5px; color: var(--m-soft); }

.m-version {
  font-size: 11px; font-weight: 700; color: #fff;
  background: rgba(99,102,241,.85);
  border-radius: 999px; padding: 3px 9px;
}

.m-icon {
  border: 1px solid var(--m-line);
  background: var(--m-panel);
  color: var(--m-ink);
  border-radius: 10px;
  width: 40px; height: 40px;
  font-size: 18px;
  cursor: pointer;
  transition: transform .1s ease, box-shadow .12s ease;
}
.m-icon:hover { box-shadow: 0 4px 14px rgba(0,0,0,.12); transform: translateY(-1px); }

/* ---------------- layout ---------------- */
.m-main { padding: 22px 20px 60px; max-width: 1240px; margin: 0 auto; }

.m-settings {
  border: 1px solid var(--m-line);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 18px;
  background: var(--m-panel);
  box-shadow: 0 10px 30px rgba(15,23,42,.06);
}

.m-field { display: block; margin-bottom: 12px; }
.m-field span { display: block; font-size: 12px; color: var(--m-soft); margin-bottom: 5px; font-weight: 600; }
.m-field input {
  width: 100%;
  padding: 11px 12px;
  border-radius: 10px;
  border: 1px solid var(--m-line);
  background: var(--m-bg);
  color: var(--m-ink);
  font-size: 14px;
}
.m-field input:focus { outline: 2px solid var(--v-accent); outline-offset: -1px; }

.m-label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 13.5px; letter-spacing: -.1px; }

textarea {
  width: 100%;
  min-height: 190px;
  padding: 15px 16px;
  border-radius: 14px;
  border: 1px solid var(--m-line);
  background: var(--m-panel);
  color: var(--m-ink);
  font-size: 14.5px;
  line-height: 1.65;
  resize: vertical;
  box-shadow: 0 10px 30px rgba(15,23,42,.05);
  transition: box-shadow .15s ease, border-color .15s ease;
}
textarea:focus {
  outline: none;
  border-color: var(--v-accent);
  box-shadow: 0 0 0 4px rgba(99,102,241,.16), 0 10px 30px rgba(15,23,42,.06);
}

.m-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 12px;
  font-size: 12px;
  flex-wrap: wrap;
}

.m-actions { display: flex; gap: 10px; }

/* buttons in the web client are a touch larger than the popup */
.v-btn { padding: 11px 18px; font-size: 13.5px; border-radius: 11px; }

#results { margin-top: 0; }

/* one column of cards inside each pane on this client */
.v-grid { grid-template-columns: 1fr; }
.v-clause code { word-break: break-word; }

/* ---------------- split pane ---------------- */
.v-split {
  display: grid;
  grid-template-columns: minmax(320px, 1fr) minmax(360px, 1.2fr);
  gap: 22px;
  align-items: start;
}
.v-pane-left, .v-pane-right { min-width: 0; }
@media (max-width: 860px) {
  .v-split { grid-template-columns: 1fr; }
}

/* verdict column card look */
.v-pane-right > #results,
.v-pane-right {
  font-size: 13px;
}

</style>
</head>
<body>

  <header class="m-header">
    <span class="m-logo">V</span>
    <div class="m-title">
      <h1>Vector</h1>
      <p>Find the security gaps in an AWS prompt before code is generated</p>
    </div>
    <span class="m-version">v0.6.0</span>
    <button id="btn-settings" class="m-icon" type="button" aria-label="Settings">&#9881;</button>
  </header>

  <main class="m-main">
    <div id="settings" class="m-settings hidden">
      <label class="m-field">
        <span>Deep scan API key (optional)</span>
        <input id="set-key" type="password" placeholder="AIza..." autocomplete="off" />
      </label>
      <label class="m-field">
        <span>Base URL</span>
        <input id="set-url" type="text" placeholder="https://generativelanguage.googleapis.com/v1beta/openai" />
      </label>
      <label class="m-field">
        <span>Model</span>
        <input id="set-model" type="text" placeholder="gemini-2.5-flash" />
      </label>
      <div class="m-row">
        <span id="set-status" class="v-muted"></span>
        <button id="btn-save" class="v-btn primary" type="button">Save</button>
      </div>
    </div>

    <div class="v-split">
      <div class="v-pane-left">
        <label class="m-label" for="prompt">AWS infrastructure prompt</label>
        <textarea id="prompt" spellcheck="false"
          placeholder="e.g. Create an S3 bucket for user documents and an EC2 instance running a web server."></textarea>
        <div class="m-row">
          <span id="hint" class="v-muted">Runs offline. Nothing leaves your browser.</span>
          <div class="m-actions">
            <button id="btn-sample" class="v-btn" type="button">Sample</button>
            <button id="btn-deep" class="v-btn" type="button">Deep scan</button>
            <button id="btn-analyze" class="v-btn primary" type="button">Analyze</button>
          </div>
        </div>
      </div>

      <div class="v-pane-right">
        <section id="results" class="hidden"></section>

        <section id="improved-wrap" class="v-improved hidden">
          <div class="v-improved-head">
            <label>Improved prompt</label>
            <button id="btn-copy" class="v-btn" type="button">Copy</button>
          </div>
          <pre id="improved" class="v-improved-body"></pre>
        </section>
      </div>
    </div>
  </main>

  
  
  
  
  
  

<script>
/* ---- engine (inlined) ---- */
"use strict";

(function (root) {
/**
 * Standards-grounded cloud security taxonomy for Vector.
 *
 * Grounded in:
 *  - CIS AWS Foundations Benchmark, Azure Foundations Benchmark, GCP Foundations
 *  - AWS Well-Architected Framework (Security Pillar)
 *  - AWS Foundational Security Best Practices (FSBP)
 *  - NIST SP 800-53 (AC, SC, AU, CP, IA, SI, PM families)
 *  - Data protection regulations (GDPR, India DPDP Act 2023)
 *
 * Each requirement has keyword patterns used to decide whether the user's
 * prompt already mentions it, plus a ready-to-append clause (the "fillable"
 * output the UI inserts with one click). Patterns are intentionally broad to
 * maximise recall; the analyzer applies a negation guard so "don't encrypt"
 * is not mistaken for "encrypt".
 */

const DIMENSIONS = {
  access_control: "Access Control",
  encryption: "Encryption",
  iam_permissions: "IAM Permissions",
  data_residency: "Data Residency",
  regional_restrictions: "Regional Restrictions",
  audit_logging: "Audit Logging",
  network_exposure: "Network Exposure",
  backup_recovery: "Backup & Recovery",
  versioning: "Versioning & Integrity",
  availability: "Availability / Resilience",
  monitoring: "Monitoring & Detection",
  secrets: "Secrets Management",
  governance: "Governance & Compliance"
};

const SEVERITY_WEIGHT = { high: 3, medium: 2, low: 1 };

const REQUIREMENTS = [
  {
    id: "encryption_at_rest",
    label: "Encryption at rest",
    dimension: "encryption",
    severity: "high",
    description:
      "Data stored on disk is readable by anyone with access to the underlying media. Encryption at rest protects data if the storage layer is compromised or a snapshot leaks.",
    clause:
      "Encrypt data at rest; specify whether a customer-managed KMS key is required.",
    standards: ["CIS AWS 2.1.1", "AWS FSBP S3.4 / RDS.3", "NIST SP 800-53 SC-28"],
    patterns: ["encrypt(ed|ion)?", "\\bkms\\b", "server[- ]side encryption", "sse[- ]?(s3|kms)", "aes[- ]?256", "at rest", "customer[- ]managed key", "\\bcmk\\b", "disk encryption"],
    notAfter: ["in transit", "over the (network|wire)"]
  },
  {
    id: "encryption_in_transit",
    label: "Encryption in transit (TLS)",
    dimension: "encryption",
    severity: "high",
    description:
      "Traffic can be intercepted or modified on the network. TLS protects data in transit and prevents downgrade / man-in-the-middle attacks.",
    clause:
      "Use TLS 1.2 or higher for every connection and redirect HTTP to HTTPS.",
    standards: ["AWS FSBP ELB.4 / CloudFront.4", "NIST SP 800-53 SC-8"],
    patterns: ["in transit", "\\btls\\b", "\\bssl\\b", "https", "encrypted (connection|traffic)", "certificate", "secure transport", "end[- ]to[- ]end encrypt"]
  },
  {
    id: "public_access_block",
    label: "Restrict public access",
    dimension: "access_control",
    severity: "high",
    description:
      "Publicly reachable storage or endpoints are the single most common cloud data-leak cause. Access should be explicit and private unless there is a deliberate, reviewed reason otherwise.",
    clause:
      "Block all public access and ACLs; expose the resource only through authenticated access.",
    standards: ["CIS AWS 2.1.4", "AWS FSBP S3.1 / S3.2", "NIST SP 800-53 AC-3"],
    patterns: [
      "\\bprivate\\b", "not (be )?public", "no public", "block (all )?(the )?(public|external|anonymous)",
      "deny public", "restrict public", "internal only", "non[- ]public", "authenticated access",
      "disable acl", "don'?t (want|make|allow) (it )?(to be )?public", "should and? ?not be public",
      "avoid public", "public access block", "anonymous access",
      "do\\s+not\\s+make[^.,;]{0,25}public", "not (enable|allow|expose)[^.,;]{0,25}public",
      "without public access", "disable public access", "keep (it |the data )?private"
    ]
  },
  {
    id: "least_privilege_iam",
    label: "Least-privilege IAM",
    dimension: "iam_permissions",
    severity: "high",
    description:
      "Over-broad IAM policies (for example wildcard actions on all resources) grant far more power than needed and turn one compromised component into a full account takeover.",
    clause:
      "Grant only the specific IAM actions and resource ARNs required (least privilege).",
    standards: ["CIS AWS 1.x", "AWS FSBP IAM.1", "NIST SP 800-53 AC-6"],
    patterns: [
      "least privilege", "least[- ]privilege", "scoped (permission|policy|role|access)",
      "specific (actions|permissions|roles?)", "minimum (permission|privilege|access)",
      "no wildcard", "narrow (permission|policy)", "read[- ]only", "fine[- ]grained",
      "least[- ]privileged", "only the (permissions|actions)"
    ]
  },
  {
    id: "no_wildcard_policy",
    label: "No wildcard policies",
    dimension: "iam_permissions",
    severity: "high",
    description:
      "Policies containing '*' in the Action or Resource field effectively grant administrative access.",
    clause:
      "In IAM policies use explicit actions and explicit resources instead of '*', scoped to the minimum required.",
    standards: ["AWS FSBP IAM.1", "CIS AWS 1.16"],
    patterns: ["no wildcard", "explicit actions", "explicit resources", "deny \\*", "avoid \\*", "no \\*:"]
  },
  {
    id: "network_restricted",
    label: "Restrict inbound network exposure",
    dimension: "network_exposure",
    severity: "high",
    description:
      "Security groups open to 0.0.0.0/0 can expose administrative or database ports to the whole internet. Internet-facing application ports are legitimate; management and data ports are not.",
    clause:
      "Restrict inbound to the required app ports (for example 443). Keep administrative and database ports reachable only from trusted networks.",
    standards: ["CIS AWS 5.2 / 5.3", "AWS FSBP EC2.18 / EC2.19", "NIST SP 800-53 SC-7"],
    patterns: [
      "restrict(ed)? (access|inbound|traffic|ports?|security group|ingress)",
      "allowlist", "whitelist", "\\bcidr\\b", "private subnet", "firewall rule",
      "limited (ports|source)", "specific ip", "only (port|from|allow|accept)",
      "ingress (rules?|restrict)", "no inbound", "closed ports", "ip range"
    ]
  },
  {
    id: "audit_logging",
    label: "Audit logging / trail",
    dimension: "audit_logging",
    severity: "high",
    description:
      "Without audit logs there is no record of who did what, so incidents cannot be detected, investigated or attributed.",
    clause:
      "Enable CloudTrail and resource access logs delivered to a central, access-controlled account.",
    standards: ["CIS AWS 3.1", "AWS FSBP CloudTrail.1", "NIST SP 800-53 AU-2 / AU-3"],
    patterns: [
      "cloudtrail", "audit log", "logging", "access log", "log all", "\\btrail\\b",
      "cloudwatch logs", "activity log", "record (api|activity)", "monitor.?(logs?|traffic)",
      "audit trail", "cloud audit", "log everything", "observability", "flow logs?"
    ]
  },
  {
    id: "data_residency",
    label: "Data residency / sovereignty",
    dimension: "data_residency",
    severity: "medium",
    description:
      "The prompt does not state where data may be stored or processed. If personal or regulated data is involved, residency must be specified to meet GDPR / DPDP obligations.",
    clause:
      "If personal or regulated data is involved, define data residency: the approved jurisdictions where data may reside.",
    standards: ["GDPR Art. 5 / 44-49", "India DPDP Act 2023 s.16", "NIST SP 800-53 PM-8"],
    patterns: [
      "data residency", "reside", "sovereignty", "\\bgdpr\\b", "in[- ]country",
      "local(ly)? (region|storage)", "compliance region", "keep data in",
      "within (the )?(eu|india|uk|country|region)", "data locality", "\\bdpdp\\b"
    ]
  },
  {
    id: "regional_restriction",
    label: "Regional restriction",
    dimension: "regional_restrictions",
    severity: "medium",
    description:
      "The prompt does not specify which AWS regions are approved. Unapproved regions can violate policy, increase cost and latency, and break data-residency guarantees.",
    clause:
      "Specify the approved AWS region(s) and restrict deployment to them.",
    standards: ["AWS Well-Architected SEC-06", "NIST SP 800-53 PM-8"],
    patterns: [
      "\\bregion", "regional", "us-east", "us-west", "eu-west", "eu-central",
      "ap-south", "ap-southeast", "specific region", "multi[- ]region", "single region",
      "availability zone", "zoned?"
    ]
  },
  {
    id: "backup_recovery",
    label: "Backup & recovery",
    dimension: "backup_recovery",
    severity: "medium",
    description:
      "Without backups, accidental deletion or ransomware becomes permanent data loss.",
    clause:
      "Enable automated backups with a defined retention period and tested restore procedure, protected against deletion.",
    standards: ["NIST SP 800-53 CP-9", "CIS AWS 2.1.2", "AWS FSBP RDS.14"],
    patterns: [
      "backup", "snapshot", "retention", "point[- ]in[- ]time", "disaster recovery",
      "restore", "recovery (time|point)", "\\brto\\b", "\\brpo\\b", "backup vault"
    ]
  },
  {
    id: "versioning",
    label: "Versioning & integrity",
    dimension: "versioning",
    severity: "medium",
    description:
      "Versioning protects against accidental overwrite/deletion and supports integrity checks and audit.",
    clause:
      "Enable versioning and integrity controls such as object lock.",
    standards: ["CIS AWS 2.1.3", "AWS FSBP S3.5"],
    patterns: ["versioning", "versioned", "mfa delete", "checksum", "integrity", "object lock", "immutable"]
  },
  {
    id: "monitoring_alerting",
    label: "Monitoring & alerting",
    dimension: "monitoring",
    severity: "medium",
    description:
      "Detecting anomalous activity requires monitoring and alerts; logging alone is not enough.",
    clause:
      "Enable continuous monitoring and alerts (for example GuardDuty and Security Hub).",
    standards: ["CIS AWS 4.x", "AWS FSBP GuardDuty.1", "NIST SP 800-53 SI-4"],
    patterns: [
      "monitor", "alert", "guardduty", "security hub", "cloudwatch", "anomaly",
      "intrusion detection", "notification", "notify", "defender", "sentinel",
      "security command center", "soc", "alarm"
    ]
  },
  {
    id: "secrets_management",
    label: "Secrets management",
    dimension: "secrets",
    severity: "high",
    description:
      "Hard-coded credentials in source or prompts leak into repositories and logs.",
    clause:
      "Credentials and secrets must be stored in AWS Secrets Manager or SSM Parameter Store and never hard-coded.",
    standards: ["AWS FSBP RDS.10", "NIST SP 800-53 IA-5", "OWASP A07:2021"],
    patterns: [
      "secret", "secrets manager", "parameter store", "\\bssm\\b", "vault",
      "key vault", "secret manager", "no hard[- ]?cod", "credentials (stored|rotated|managed)",
      "rotate", "environment variable", "injected secret",
      "credential[^.]{0,25}secur", "secur[a-z]*[^.]{0,25}credential",
      "store[^.]{0,20}(credential|password|secret)"
    ]
  },
  {
    id: "availability",
    label: "High availability / resilience",
    dimension: "availability",
    severity: "low",
    description:
      "Single-AZ deployments fail when an availability zone goes down.",
    clause:
      "Deploy across at least two availability zones behind a load balancer with health checks.",
    standards: ["AWS Well-Architected REL-10", "NIST SP 800-53 CP-6"],
    patterns: [
      "multi[- ]az", "availability zone", "highly available", "high availability",
      "\\bha\\b", "failover", "redundant", "load balanc", "replicated", "multiple zones"
    ]
  },
  {
    id: "network_isolation",
    label: "Network isolation (VPC)",
    dimension: "network_exposure",
    severity: "medium",
    description:
      "Resources should sit inside a VPC/VNet with public/private subnet separation to limit lateral movement.",
    clause:
      "Use a VPC with public and private subnets; keep data and compute in private subnets.",
    standards: ["CIS AWS 5.1", "AWS FSBP EC2.15", "NIST SP 800-53 SC-7"],
    patterns: [
      "\\bvpc\\b", "\\bvnet\\b", "subnet", "private subnet", "network isolation",
      "isolated network", "nat gateway", "no internet gateway", "bastion", "network segmentation"
    ]
  },
  {
    id: "waf_protection",
    label: "Edge protection (WAF / DDoS)",
    dimension: "network_exposure",
    severity: "medium",
    description:
      "Internet-facing endpoints should be protected against common web exploits and volumetric attacks.",
    clause:
      "Put a WAF with managed rules and rate limiting in front of public endpoints.",
    standards: ["AWS FSBP WAF.1", "CIS AWS 5.x", "NIST SP 800-53 SC-5"],
    patterns: ["\\bwaf\\b", "web application firewall", "\\bddos\\b", "shield", "rate[- ]limit", "owasp rules?", "bot control", "cloud armor"]
  },
  {
    id: "key_rotation",
    label: "Key rotation",
    dimension: "encryption",
    severity: "medium",
    description:
      "Long-lived encryption keys increase the impact of a key compromise.",
    clause:
      "Enable automatic rotation for KMS keys and secrets.",
    standards: ["CIS AWS 3.7", "AWS FSBP KMS.4"],
    patterns: ["key rotation", "rotate (the )?(key|keys)", "rotation (enabled|period)", "automatic rotation", "renew (key|secret)", "\\brotation\\b"]
  },
  {
    id: "private_endpoint",
    label: "Private connectivity / endpoints",
    dimension: "network_exposure",
    severity: "medium",
    description:
      "Traffic to managed services should not traverse the public internet; private endpoints reduce exposure.",
    clause:
      "Use VPC endpoints (PrivateLink) so managed-service traffic stays off the public internet.",
    standards: ["AWS FSBP EC2.10", "CIS AWS 5.x"],
    patterns: ["private endpoint", "vpc endpoint", "privatelink", "private link", "private connectivity", "private service connect", "service endpoint"]
  },
  {
    id: "imdsv2",
    label: "Instance metadata hardening (IMDSv2)",
    dimension: "network_exposure",
    severity: "medium",
    description:
      "IMDSv1 can be abused via SSRF to steal instance credentials; IMDSv2 requires a session token.",
    clause:
      "Require IMDSv2 and disable IMDSv1 on all instances.",
    standards: ["AWS FSBP EC2.8", "CIS AWS 5.x"],
    patterns: ["imds", "imdsv2", "metadata service", "instance metadata", "session token"]
  },
  {
    id: "mfa",
    label: "Multi-factor authentication",
    dimension: "access_control",
    severity: "high",
    description:
      "Single-factor authentication is easily defeated by credential theft or phishing.",
    clause:
      "Require MFA for all privileged and root access.",
    standards: ["CIS AWS 1.2 / 1.10", "AWS FSBP IAM.6", "NIST SP 800-53 IA-2"],
    patterns: ["\\bmfa\\b", "multi[- ]?factor", "two[- ]?factor", "\\b2fa\\b", "one[- ]time password", "authenticator"]
  },
  {
    id: "password_policy",
    label: "Password / credential policy",
    dimension: "access_control",
    severity: "medium",
    description:
      "Weak password policies make brute-force and credential-stuffing attacks trivial.",
    clause:
      "Enforce a strong password policy (length, complexity, reuse prevention) and credential rotation where applicable.",
    standards: ["CIS AWS 1.8", "NIST SP 800-53 IA-5"],
    patterns: ["password policy", "password complexity", "minimum length", "credential policy", "password rotation", "strong password"]
  },
  {
    id: "data_classification",
    label: "Data classification / sensitive data",
    dimension: "access_control",
    severity: "medium",
    description:
      "Without classifying data you cannot apply proportionate controls or meet privacy obligations.",
    clause:
      "Classify data (public / internal / confidential / PII) and apply matching controls.",
    standards: ["NIST SP 800-53 RA-2", "ISO 27001 A.8.2", "GDPR Art. 5"],
    patterns: ["classif", "\\bpii\\b", "sensitive data", "confidential", "personal data", "data inventory", "data catalog"]
  },
  {
    id: "retention_deletion",
    label: "Retention & secure deletion",
    dimension: "versioning",
    severity: "medium",
    description:
      "Data kept indefinitely increases breach impact and violates storage-limitation rules.",
    clause:

/**
 * True if the clause before the match contains an ODD number of negations
 * (so "not not encrypted" is treated as positive, and "no public access and
 * encryption" does not leak the "no" onto "encryption").
 */
function isNegatedBefore(text, index) {
  const start = Math.max(0, index - 60);
  const window = text.slice(start, index);
  const parts = window.split(CLAUSE_SPLIT);
  const clause = parts[parts.length - 1] || "";
  const hits = clause.match(NEGATION_RE_G);
  return !!(hits && hits.length % 2 === 1);
}

/** True if the match is immediately followed by a disabling word ("logging disabled"). */
function isNegatedAfter(text, index) {
  const window = text.slice(index, index + 18);
  const cut = window.search(CLAUSE_SPLIT);
  const seg = cut >= 0 ? window.slice(0, cut) : window;
  return /\b(disabled|off|turned off|not enabled|inactive)\b/.test(seg);
}

const INTENT_VERBS = [
  ["deploy", /\b(deploy|provision|spin up|launch|host)\b/i],
  ["create", /\b(create|build|set up|provision|make|add)\b/i],
  ["store", /\b(store|save|persist|upload|host)\b/i],
  ["allow", /\b(allow|permit|enable|open|expose|grant)\b/i],
  ["restrict", /\b(restrict|deny|block|limit|disable|prevent)\b/i],
  ["secure", /\b(secure|protect|encrypt|harden|comply|compliant)\b/i],
  ["connect", /\b(connect|integrate|link|route|peer)\b/i],
  ["backup", /\b(backup|snapshot|replicate|recover)\b/i],
  ["monitor", /\b(monitor|alert|log|observe|audit|track)\b/i]
];

function detectIntents(text) {
  const found = [];
  for (const [name, re] of INTENT_VERBS) {
    if (re.test(text)) found.push(name);
  }
  return found;
}

function detectResources(haystack) {
  const found = [];
  for (const res of RESOURCES) {
    const hit = res.aliases.find((a) => aliasMatches(haystack, a));
    if (hit) found.push({ id: res.id, label: res.label, matched: hit });
  }
  return found;
}

/**
 * @returns {{present:boolean, negated:boolean}} negated=true means the only
 * mentions were explicitly negated (e.g. "do not encrypt").
 */
function detectRequirement(requirement, text) {
  const matches = findMatches(text, requirement.patterns);
  if (matches.length === 0) return { present: false, negated: false };
  const positive = matches.some((m) => {
    const end = m.index + m.value.length;
    if (isNegatedBefore(text, m.index)) return false;
    if (isNegatedAfter(text, end)) return false;
    // e.g. encryption_at_rest must not be satisfied by "encryption in transit"
    if (requirement.notAfter) {
      const seg = text.slice(end, end + 20);
      if (requirement.notAfter.some((p) => new RegExp(p, "i").test(seg))) return false;
    }
    return true;
  });
  return { present: positive, negated: !positive };
}

function severityRank(s) {
  return SEVERITY_WEIGHT[s] || 1;
}

function riskLevelFromScore(score) {
  return RISK_LEVELS.find((r) => score >= r.min) || RISK_LEVELS[RISK_LEVELS.length - 1];
}

/**
 * How confident the RULE engine is that its analysis is complete for this
 * prompt. Low confidence is the trigger for the optional AI deep scan.
 */
function computeConfidence(info) {
  let score = info.baselineOnly ? 34 : 78;
  if (info.tokenCount < 4) score -= 22;
  else if (info.tokenCount < 8) score -= 8;
  if (info.mentioned + info.missing === 0) score -= 20;
  if (info.resources >= 2) score += 6;
  score = Math.max(5, Math.min(98, Math.round(score)));
  const label = score >= 75 ? "high" : score >= 45 ? "medium" : "low";
  return { score: score, label: label, needsDeepScan: score < 50 };
}

function applyPolicy(requirements, risky, policy) {
  const reqs = requirements.map((r) => Object.assign({}, r, { patterns: r.patterns.slice() }));
  const outRisky = risky.slice();

  if (!policy) return { requirements: reqs, risky: outRisky };

  if (Array.isArray(policy.requirements)) {
    for (const custom of policy.requirements) {
      if (!custom || !custom.id) continue;
      reqs.push({
        id: custom.id,
        label: custom.label || custom.id,
        dimension: custom.dimension || "governance",
        severity: custom.severity || "high",
        description: custom.description || "Custom organisation policy requirement.",
        clause: custom.clause || custom.description || custom.label,
        standards: custom.standards || ["Organisation policy"],
        patterns: custom.patterns || [],
        alwaysRequired: custom.alwaysRequired !== false,
        custom: true
      });
    }
  }

  if (Array.isArray(policy.riskyPatterns)) {
    for (const rp of policy.riskyPatterns) {
      if (!rp || !rp.pattern) continue;
      outRisky.push({
        id: rp.id || "policy_" + outRisky.length,
        pattern: rp.pattern,
        label: rp.label || "Policy violation",
        severity: rp.severity || "high",
        description: rp.description || "Violates an organisation policy rule.",
        fix: rp.fix || rp.description || "Revise the prompt to comply with policy."
      });
    }
  }

  return { requirements: reqs, risky: outRisky };
}

function dedupeRiskyFindings(text, risky) {
  const seen = new Map();
  for (const rp of risky) {
    let re;
    try {
      re = new RegExp(rp.pattern, "gi");
    } catch (e) {
      continue;
    }
    let m;
    let matched = false;
    while ((m = re.exec(text)) !== null) {
      if (m.index === re.lastIndex) re.lastIndex++;
      if (isNegatedBefore(text, m.index)) continue;
      matched = true;
      break;
    }
    if (matched && !seen.has(rp.id)) {
      seen.set(rp.id, {
        id: rp.id,
        label: rp.label,
        severity: rp.severity,
        weight: severityRank(rp.severity) * 1.5,
        description: rp.description,
        fix: rp.fix,
        source: "rule"
      });
    }
  }
  return Array.from(seen.values());
}

function computeRisk(relevantCounts, findings) {
  let missingWeight = 0;
  let maxWeight = 0;
  for (const item of relevantCounts) {
    maxWeight += item.weight;
    if (item.missing) missingWeight += item.weight;
  }
  const ratio = missingWeight / Math.max(1, maxWeight);
  let score = 100 * Math.pow(ratio, 1.5);
  let riskyWeight = 0;
  for (const f of findings) riskyWeight += severityRank(f.severity) * 1.5;
  const riskyBump = Math.min(55, riskyWeight * 9);
  return Math.min(100, Math.round(score + riskyBump));
}

/**
 * Recompute risk + coverage for a hypothetical set of accepted clauses.
 * Used by the UI to show "risk 99 -> 40" and "coverage 0% -> 60%" as the user
 * accepts recommendations, i.e. that the suggestions actually improve the score.
 * @param {object} report
 * @param {object} accepted  map of id -> boolean
 */
function project(report, accepted) {
  accepted = accepted || {};
  const on = (id) => !!accepted[id];

  let missingWeight = 0;
  for (const m of report.missing) {
    if (on(m.id)) continue;
    missingWeight += typeof m.weight === "number" ? m.weight : severityRank(m.severity);
  }
  let riskyWeight = 0;
  for (const f of report.riskyFindings) {
    if (on(f.id)) continue;
    riskyWeight += typeof f.weight === "number" ? f.weight : severityRank(f.severity) * 1.5;
  }

  const ratio = missingWeight / Math.max(1, report.totalWeight || 1);
  const base = Math.min(100, Math.round(100 * Math.pow(ratio, 1.5) + Math.min(55, riskyWeight * 9)));
  const riskScore = Math.min(100, Math.round(base * (report.envFactor || 1)));

  const total = report.stats.mentioned + report.stats.missing;
  let covered = report.stats.mentioned;
  for (const m of report.missing) if (on(m.id)) covered++;

  return {
    riskScore: riskScore,
    riskLevel: riskLevelFromScore(riskScore).level,
    coverageScore: total ? Math.round((100 * covered) / total) : 100
  };
}

function analyze(prompt, options) {
  options = options || {};
  const raw = String(prompt || "");
  const normalized = normalize(raw);
  const expanded = expandSynonyms(normalized);
  const tokens = tokenize(raw);
  const intents = detectIntents(expanded);

  const merged = applyPolicy(REQUIREMENTS, RISKY_PATTERNS, options.policy);
  const requirements = merged.requirements;
  const risky = merged.risky;

  const resources = detectResources(expanded);

  // Scope guard: decide whether this is a cloud infrastructure prompt at all.
  // An ambiguous word alone ("a bucket of water") must NOT count, and off-topic
  // text must not be scored. In scope if any of:
  //   - a strong cloud/provisioning term (aws, s3, terraform, vpc ...)
  //   - an infrastructure intent verb (create/deploy/...)
  //   - two or more infrastructure terms
  //   - a resource matched by an unambiguous alias (not "bucket", "queue" ...)
  function termMatches(terms, text) {
    return terms.filter((t) => {
      try {
        return new RegExp("(^|[^a-z0-9])" + t + "([^a-z0-9]|$)", "i").test(text);
      } catch (e) {
        return false;
      }
    }).length;
  }

  const infraHits = termMatches(INFRA_TERMS, normalized);
  const hasStrongTerm = termMatches(STRONG_TERMS, normalized) > 0;
  // Resource evidence must come from the ORIGINAL text, not the synonym-expanded
  // text (otherwise "bucket" -> "s3" would look strong).
  const strongResource = detectResources(normalized).some((r) => {
    if (/[\\^$.*+?()[\]{}|]/.test(r.matched)) return true; // regex alias is specific
    return AMBIGUOUS_ALIASES.indexOf(String(r.matched).toLowerCase()) === -1;
  });
  // A clearly security-relevant statement is in scope even without an intent verb
  // ("hard-code the password", "send data in plaintext").
  const hasRiskySignal = RISKY_PATTERNS.some((rp) => {
    try {
      return new RegExp(rp.pattern, "i").test(normalized);
    } catch (e) {
      return false;
    }
  });

  const inScope =
    hasStrongTerm || intents.length > 0 || infraHits >= 2 || strongResource || hasRiskySignal;

  if (!inScope) {
    return {
      prompt: raw,
      tokens: tokens,
      intents: intents,
      resources: [],
      mentioned: [],
      missing: [],
      riskyFindings: [],
      riskScore: 0,
      riskLevel: "MINIMAL",
      riskColor: "#16a34a",
      coverage: "out-of-scope",
      coverageScore: 0,
      totalWeight: 0,
      tierCounts: { core: 0, clarify: 0, harden: 0 },
      semanticRelated: [],
      nonAwsLikely: false,
      outOfScope: true,
      environment: "unknown",
      envFactor: 1,
      feedback: [
        "This does not look like an AWS infrastructure prompt, so there is nothing to diagnose. Describe the AWS resources you want, for example \"an S3 bucket for user documents\" or \"an RDS database for the app\"."
      ],
      disclaimer: "Diagnostic aid for AWS prompts. Findings are advisory, not a guarantee - verify before deploying.",
      confidence: "low",
      confidenceScore: 0,
      needsDeepScan: false,
      standards: STANDARDS.sources,
      dimensions: DIMENSIONS,
      stats: { resources: 0, mentioned: 0, missing: 0, risky: 0 }
    };
  }

  // Non-AWS guard: warn instead of silently applying AWS baseline to an
  // Azure/GCP prompt (which would be misleading).
  const nonAwsTerm = NON_AWS_TERMS.find((t) => new RegExp(t, "i").test(normalized)) || null;
  const nonAwsLikely = !!nonAwsTerm;

  // Environment context (rule-based cues) adjusts the risk weight: a dev
  // sandbox is lower risk than production.
  const isDev = CONTEXT_CUES.dev.some((c) => new RegExp(c, "i").test(normalized));
  const isProd = CONTEXT_CUES.prod.some((c) => new RegExp(c, "i").test(normalized));
  const environment = isProd ? "prod" : isDev ? "dev" : "unknown";
  const envFactor = ENV_FACTOR[environment] || 1;

  const relevantIds = new Set();
  const appliesTo = new Map();

  if (resources.length > 0) {
    for (const r of resources) {
      const def = RESOURCES.find((x) => x.id === r.id);
      if (!def) continue;
      for (const reqId of def.required) {
        relevantIds.add(reqId);
        if (!appliesTo.has(reqId)) appliesTo.set(reqId, []);
        appliesTo.get(reqId).push(def.label);
      }
    }
  } else {
    const baseline = DEFAULT_REQUIRED.concat([
      "network_restricted",
      "network_isolation",
      "secrets_management",
      "backup_recovery",
      "monitoring_alerting"
    ]);
    for (const id of baseline) {
      relevantIds.add(id);
      if (!appliesTo.has(id)) appliesTo.set(id, ["Baseline (no resource recognised)"]);
    }
  }

  for (const req of requirements) {
    if (req.alwaysRequired) {
      relevantIds.add(req.id);
      if (!appliesTo.has(req.id)) appliesTo.set(req.id, ["Organisation policy"]);
    }
  }

  const mentioned = [];
  let missing = [];
  const relevantCounts = [];

  for (const req of requirements) {
    if (!relevantIds.has(req.id)) continue;
    const tier = req.tier || "clarify";
    const baseSeverity = options.strictMode && req.severity === "medium" ? "high" : req.severity;
    const weight = severityRank(baseSeverity) * (TIER_MULT[tier] || 1);
    const res = detectRequirement(req, normalized);
    relevantCounts.push({ id: req.id, weight: weight, missing: !res.present });

    if (res.present) {
      mentioned.push({
        id: req.id,
        label: req.label,
        dimension: DIMENSIONS[req.dimension] || req.dimension,
        severity: req.severity,
        tier: tier,
        tf: req.tf,
        description: req.description,
        standards: req.standards
      });
    } else {
      missing.push({
        id: req.id,
        label: req.label,
        dimension: DIMENSIONS[req.dimension] || req.dimension,
        severity: req.severity,
        tier: tier,
        weight: weight,
        tf: req.tf,
        description: req.description,
        clause: req.clause,
        standards: req.standards,
        appliesTo: appliesTo.get(req.id) || [],
        explicitlyNegated: res.negated,
        custom: !!req.custom,
        source: "rule"
      });
    }
  }

  // ---- Second pass: TF-IDF semantic similarity (classic NLP / IR) ----
  // Each control is a "document". We rank controls by cosine similarity to the
  // prompt and report the top matches as TOPICALLY RELATED.
  //
  // Measurement (tools/calibrate.js) shows cosine is polarity-blind: "open all
  // ports" scores 0.49 against the "restrict ports" control, while a genuine
  // paraphrase ("scrambled on disk") scores only 0.20. So it must NOT decide
  // whether a control is already stated, and it must NOT override the rules.
  // It is reported as related-topic information only, and the control stays
  // flagged by the rule engine.
  const semIndex = _VectorSemantic.buildIndex(requirements);
  const queryTokens = _VectorSemantic.tokenize(normalized);
  const queryVec = _VectorSemantic.vectorize(queryTokens, semIndex.idf);
  const semanticRelated = requirements
    .map((req) => ({
      id: req.id,
      label: req.label,
      similarity: Number(_VectorSemantic.cosine(queryVec, semIndex.vectors.get(req.id)).toFixed(2))
    }))
    .filter((x) => x.similarity >= 0.2)
    .sort((a, b) => b.similarity - a.similarity)
    .slice(0, 3);

  missing.sort((a, b) => severityRank(b.severity) - severityRank(a.severity));
  const riskyFindings = dedupeRiskyFindings(normalized, risky);
  riskyFindings.sort((a, b) => severityRank(b.severity) - severityRank(a.severity));

  let riskScore = computeRisk(relevantCounts, riskyFindings);
  riskScore = Math.min(100, Math.round(riskScore * envFactor));
  const riskMeta = riskLevelFromScore(riskScore);

  const baselineOnly = resources.length === 0;
  const confidence = computeConfidence({
    baselineOnly: baselineOnly,
    tokenCount: tokens.length,
    mentioned: mentioned.length,
    missing: missing.length,
    resources: resources.length
  });
  const totalControls = mentioned.length + missing.length;
  const coverageScore = totalControls ? Math.round((100 * mentioned.length) / totalControls) : 100;
  const totalWeight = relevantCounts.reduce(function (a, r) { return a + r.weight; }, 0);

  const tierCounts = { core: 0, clarify: 0, harden: 0 };
  for (const m of missing) tierCounts[m.tier || "clarify"]++;

  const feedback = [];
  if (nonAwsLikely) {
    feedback.push(
      'This prompt appears to target a non-AWS cloud ("' + nonAwsTerm + '"). Vector is AWS-specific, so the findings below are generic security advice, not AWS guidance.'
    );
  }
  if (baselineOnly) {
    feedback.push(
      "No specific cloud resource was recognised, so Vector applied baseline AWS controls. Name the resources (for example S3, EC2, RDS, Lambda) for targeted analysis."
    );
  } else {
    feedback.push("Detected resources: " + resources.map((r) => r.label).join(", ") + ".");
  }
  if (riskyFindings.length) {
    feedback.push(riskyFindings.length + " risky statement(s) found — correct these before generation.");
  }
  if (missing.length) {
    feedback.push(missing.length + " security constraint(s) missing — add them so the generator does not have to guess.");
  }
  if (!missing.length && !riskyFindings.length) {
    feedback.push("No missing security constraints detected for the recognised resources. Review organisation-specific rules.");
  }
  if (environment === "dev") {
    feedback.push("This looks like a development/sandbox prompt, so the risk score is reduced. Harden before production.");
  } else if (environment === "prod") {
    feedback.push("This looks like a production prompt, so the risk score is weighted higher.");
  }
  if (confidence.needsDeepScan) {
    feedback.push("Low confidence on this prompt, so some constraints may be unstated - the optional Deep scan can fill the gaps.");
  }

  return {
    prompt: raw,
    tokens,
    intents,
    resources,
    mentioned,
    missing,
    riskyFindings,
    riskScore,
    riskLevel: riskMeta.level,
    riskColor: riskMeta.color,
    feedback,
    baselineOnly,
    coverage: baselineOnly ? "baseline" : "targeted",
    coverageScore: coverageScore,
    totalWeight: totalWeight,
    tierCounts: tierCounts,
    semanticRelated: semanticRelated,
    nonAwsLikely: nonAwsLikely,
    environment: environment,
    envFactor: envFactor,
    disclaimer: "Diagnostic aid for AWS prompts. Findings are advisory, not a guarantee - verify before deploying.",
    confidence: confidence.label,
    confidenceScore: confidence.score,
    // Deep scan is suggested when the rule engine is unsure (low confidence)
    // OR when the prompt leaves a large part of the security surface unstated
    // (coverage < 50%). The second condition also covers the case where a
    // resource IS recognised but a control is paraphrased and missed.
    needsDeepScan: confidence.needsDeepScan || coverageScore < 50,
    standards: STANDARDS.sources,
    dimensions: DIMENSIONS,
    stats: {
      resources: resources.length,
      mentioned: mentioned.length,
      missing: missing.length,
      risky: riskyFindings.length
    }
  };
}

/**
 * Merge external (e.g. LLM deep-scan) findings into a report.
 * @param {object} report
 * @param {{missing?:Array, risky?:Array}} external
 * @param {boolean} [external.clean]  the model reported no remaining issues
 * @param {{drop?:Array<{id:string,reason:string}>}} [review]  AI second-opinion dismissals
 */
function mergeFindings(report, external, review) {
  if (!external) external = {};
  const missing = report.missing.slice();
  const riskyFindings = report.riskyFindings.slice();
  const seenMissing = new Set(missing.map((m) => (m.label || "").toLowerCase()));
  const seenRisky = new Set(riskyFindings.map((r) => (r.label || "").toLowerCase()));

  for (const m of external.missing || []) {
    if (!m || !m.label) continue;
    if (seenMissing.has(m.label.toLowerCase())) continue;
    seenMissing.add(m.label.toLowerCase());
    missing.push({
      id: m.id || "ai_" + missing.length,
      label: m.label,
      dimension: m.dimension || "governance",
      severity: m.severity || "medium",
      tier: m.tier || "clarify",
      weight: severityRank(m.severity || "medium") * (TIER_MULT[m.tier || "clarify"] || 1),
      tf: "",
      description: m.description || "Identified by deep scan.",
      clause: m.clause || m.description || m.label,
      standards: m.standards || ["Deep scan"],
      appliesTo: ["Deep scan"],
      source: "ai"
    });
  }

  for (const r of external.risky || []) {
    if (!r || !r.label) continue;
    if (seenRisky.has(r.label.toLowerCase())) continue;
    seenRisky.add(r.label.toLowerCase());
    riskyFindings.push({
      id: r.id || "ai_risky_" + riskyFindings.length,
      label: r.label,
      severity: r.severity || "high",
      weight: severityRank(r.severity || "high") * 1.5,
      description: r.description || "Identified by deep scan.",
      fix: r.fix || r.description || r.label,
      source: "ai"
    });
  }

  missing.sort((a, b) => severityRank(b.severity) - severityRank(a.severity));
  riskyFindings.sort((a, b) => severityRank(b.severity) - severityRank(a.severity));

  const merged = Object.assign({}, report, { missing, riskyFindings });
  merged.stats = {
    resources: report.stats.resources,
    mentioned: report.stats.mentioned,
    missing: missing.length,
    risky: riskyFindings.length
  };
  const tierCounts = { core: 0, clarify: 0, harden: 0 };
  for (const m of missing) tierCounts[m.tier || "clarify"]++;
  merged.tierCounts = tierCounts;
  merged.totalWeight = report.totalWeight + missing
    .filter((m) => m.source === "ai")
    .reduce((a, m) => a + (m.weight || 0), 0);
  let extra = 0;
  for (const m of missing) if (m.source === "ai") extra += severityRank(m.severity);
  for (const r of riskyFindings) if (r.source === "ai") extra += severityRank(r.severity) * 1.5;
  merged.riskScore = Math.min(100, report.riskScore + Math.round(extra * 3));
  const meta = riskLevelFromScore(merged.riskScore);
  merged.riskLevel = meta.level;
  merged.riskColor = meta.color;
  merged.feedback = report.feedback.concat(
    extra > 0 ? ["Deep scan added " + (missing.filter((m) => m.source === "ai").length + riskyFindings.filter((r) => r.source === "ai").length) + " additional finding(s)."] : []
  );

  // If the model says there is nothing further to flag AND the rules found
  // nothing risky, present a clean state.
  merged.aiClean = !!external.clean && riskyFindings.length === 0;
  if (merged.aiClean) {
    merged.feedback = merged.feedback.concat(["Deep scan found no additional issues."]);
  }

  // ---- AI second opinion: demote rule findings the model says are not needed.
  // Safety: a dismissed finding is NEVER deleted - it moves to dismissed[] so the
  // user can see it and restore it. core-tier findings cannot be dismissed.
  if (review && Array.isArray(review.drop) && review.drop.length) {
    const reasons = new Map();
    for (const d of review.drop) if (d && d.id) reasons.set(String(d.id), String(d.reason || "Not required for this prompt."));

    const kept = [];
    const dismissed = [];
    for (const m of merged.missing) {
      const tier = m.tier || "clarify";
      if (reasons.has(m.id) && tier !== "core") {
        dismissed.push(Object.assign({}, m, {
          dismissalReason: reasons.get(m.id),
          dismissedBy: "ai"
        }));
      } else {
        kept.push(m);
      }
    }
    merged.missing = kept;
    merged.dismissed = dismissed;

    if (dismissed.length) {
      merged.tierCounts = { core: 0, clarify: 0, harden: 0 };
      for (const m of kept) merged.tierCounts[m.tier || "clarify"]++;
      merged.stats = {
        resources: report.stats.resources,
        mentioned: report.stats.mentioned,
        missing: kept.length,
        risky: merged.riskyFindings.length
      };
      const droppedWeight = dismissed.reduce((a, m) => a + (m.weight || 0), 0);
      merged.totalWeight = Math.max(1, (merged.totalWeight || report.totalWeight) - droppedWeight);
      merged.riskScore = project(merged, {}).riskScore;
      const meta2 = riskLevelFromScore(merged.riskScore);
      merged.riskLevel = meta2.level;
      merged.riskColor = meta2.color;
      merged.feedback = merged.feedback.concat([
        "AI review set aside " + dismissed.length + " finding(s) it judged not required; see the dismissed list and restore any you disagree with."
      ]);
    }
  }
  if (!merged.dismissed) merged.dismissed = [];

  return merged;
}

function buildImprovedPrompt(prompt, clauses) {
  const base = String(prompt || "").trim();
  const list = (clauses || []).map((c) => String(c).trim()).filter(Boolean);
  if (list.length === 0) return base;

// Vector mobile app logic. Reuses the shared engine (analyzer/ui/semantic/llm).
(function () {
  const el = {
    prompt: document.getElementById("prompt"),
    analyze: document.getElementById("btn-analyze"),
    sample: document.getElementById("btn-sample"),
    deep: document.getElementById("btn-deep"),
    settingsBtn: document.getElementById("btn-settings"),
    settings: document.getElementById("settings"),
    key: document.getElementById("set-key"),
    url: document.getElementById("set-url"),
    model: document.getElementById("set-model"),
    save: document.getElementById("btn-save"),
    status: document.getElementById("set-status"),
    hint: document.getElementById("hint"),
    results: document.getElementById("results"),
    improvedWrap: document.getElementById("improved-wrap"),
    improved: document.getElementById("improved"),
    copy: document.getElementById("btn-copy")
  };

  const DEFAULTS = {
    apiKey: "",
    baseUrl: "https://generativelanguage.googleapis.com/v1beta/openai",
    model: "gemini-2.5-flash"
  };

  const SAMPLE =
    "Create an S3 bucket to store user documents and an EC2 instance running a web server " +
    "with a security group that allows SSH from 0.0.0.0/0. Give the instance an IAM role with admin access.";

  let settings = DEFAULTS;
  let report = null;
  let state = { accepted: {} };

  function loadSettings() {
    try {
      settings = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem("vectorSettings") || "{}"));
    } catch (e) {
      settings = Object.assign({}, DEFAULTS);
    }
  }
  function saveSettings() {
    try { localStorage.setItem("vectorSettings", JSON.stringify(settings)); } catch (e) {}
  }

  function toast(msg) {
    let t = document.querySelector(".m-toast");
    if (!t) {
      t = document.createElement("div");
      t.className = "vp-toast m-toast";
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 1500);
  }

  function updateImproved() {
    if (!report) return;
    if (report.outOfScope) {
      el.improvedWrap.classList.add("hidden");
      return;
    }
    const clauses = VectorUI.acceptedClauses(report, state);
    el.improved.textContent = VectorUI.buildImprovedPrompt(report.prompt, clauses);
    el.improvedWrap.classList.remove("hidden");
  }

  function render(opts) {
    VectorUI.renderInto(el.results, report, state, {
      onToggle: function (id) { state.accepted[id] = !state.accepted[id]; render(); },
      onAcceptAll: function () {
        report.missing.forEach(function (m) { state.accepted[m.id] = true; });
        report.riskyFindings.forEach(function (f) { state.accepted[f.id] = true; });
        render();
      },
      onClearAll: function () { state.accepted = {}; render(); }
    }, opts || {});
    updateImproved();
  }

  function setHint() {
    const t = report.tierCounts || { core: 0, clarify: 0, harden: 0 };
    el.hint.textContent =
      report.riskLevel + " " + report.riskScore + "/100 · coverage " + report.coverageScore +
      "% · " + t.core + " confirmed";
  }

  function analyzeNow() {
    const prompt = el.prompt.value.trim();
    if (!prompt) { el.hint.textContent = "Enter a prompt first"; return; }
    report = VectorAnalyzer.analyze(prompt, { strictMode: false });
    state.accepted = {};
    el.results.classList.remove("hidden");
    render();
    setHint();

  async function deepScanNow() {
    const prompt = el.prompt.value.trim();
    if (!prompt) return;
    if (!settings.apiKey) {
      el.settings.classList.remove("hidden");
      el.status.textContent = "Add an API key for deep scan.";
      return;
    }
    el.deep.disabled = true;
    el.deep.textContent = "Scanning...";
    if (!report) report = VectorAnalyzer.analyze(prompt, { strictMode: false });
    const base = report;
    render({ busy: "Reviewing this prompt with AI..." });
    try {
      const result = await VectorLLM.deepScan(prompt, settings);
      let merged = VectorAnalyzer.mergeFindings(base, result.findings);
      if (settings.reviewFindings && merged.missing.length) {
        try {

      render();
      setHint();

      render();

      } else {
        toast(m || "Deep scan failed");
      }
    } finally {
      el.deep.disabled = false;
      el.deep.textContent = "Deep scan";
    }
  }

  function copyImproved() {
    const text = el.improved.textContent || "";
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast("Copied"); }, function () { toast("Copy failed"); });

      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); toast("Copied"); } catch (e) { toast("Copy failed"); }
      document.body.removeChild(ta);

  el.deep.addEventListener("click", deepScanNow);

      baseUrl: el.url.value.trim() || DEFAULTS.baseUrl,
      model: el.model.value.trim() || DEFAULTS.model

  el.url.value = settings.baseUrl || "";
  el.model.value = settings.model || "";

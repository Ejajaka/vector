<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6366f1" />
  <title>Vector - AWS Prompt Security</title>
  <link rel="stylesheet" href="src/ui.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="m-header">
    <span class="m-logo">V</span>
    <div class="m-title">
      <h1>Vector</h1>
      <p>Find the security gaps in an AWS prompt before code is generated</p>
    </div>
    <span class="m-version">v0.6.0</span>
    <button id="btn-settings" class="m-icon" type="button" aria-label="Settings">&#9881;</button>
  </header>

  <main class="m-main">
    <div id="settings" class="m-settings hidden">
      <label class="m-field">
        <span>Deep scan API key (optional)</span>
        <input id="set-key" type="password" placeholder="AIza..." autocomplete="off" />
      </label>
      <label class="m-field">
        <span>Base URL</span>
        <input id="set-url" type="text" placeholder="https://generativelanguage.googleapis.com/v1beta/openai" />
      </label>
      <label class="m-field">
        <span>Model</span>
        <input id="set-model" type="text" placeholder="gemini-2.5-flash" />
      </label>
      <div class="m-row">
        <span id="set-status" class="v-muted"></span>
        <button id="btn-save" class="v-btn primary" type="button">Save</button>
      </div>
    </div>

    <div class="v-split">
      <div class="v-pane-left">
        <label class="m-label" for="prompt">AWS infrastructure prompt</label>
        <textarea id="prompt" spellcheck="false"
          placeholder="e.g. Create an S3 bucket for user documents and an EC2 instance running a web server."></textarea>
        <div class="m-row">
          <span id="hint" class="v-muted">Runs offline. Nothing leaves your browser.</span>
          <div class="m-actions">
            <button id="btn-sample" class="v-btn" type="button">Sample</button>
            <button id="btn-deep" class="v-btn" type="button">Deep scan</button>
            <button id="btn-analyze" class="v-btn primary" type="button">Analyze</button>
          </div>
        </div>
      </div>

      <div class="v-pane-right">
        <section id="results" class="hidden"></section>

        <section id="improved-wrap" class="v-improved hidden">
          <div class="v-improved-head">
            <label>Improved prompt</label>
            <button id="btn-copy" class="v-btn" type="button">Copy</button>
          </div>
          <pre id="improved" class="v-improved-body"></pre>
        </section>
      </div>
    </div>
  </main>

  <script src="src/taxonomy.js?v=0.6.0"></script>
  <script src="src/semantic.js?v=0.6.0"></script>
  <script src="src/analyzer.js?v=0.6.0"></script>
  <script src="src/ui.js?v=0.6.0"></script>
  <script src="src/llm.js?v=0.6.0"></script>
  <script src="app.js?v=0.6.0"></script>
</body>
</html>
